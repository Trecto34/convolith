[package]
name = "convolith-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
convolith = { path = ".." }
anyhow = "1"
serde_json = "1"

# Keep the fuzz crate out of the main package's build and lockfile.
[workspace]

[[bin]]
name = "archive_path"
path = "fuzz_targets/archive_path.rs"
test = false
doc = false

[[bin]]
name = "timestamp"
path = "fuzz_targets/timestamp.rs"
test = false
doc = false

[[bin]]
name = "jsonl_lines"
path = "fuzz_targets/jsonl_lines.rs"
test = false
doc = false

[[bin]]
name = "event_json"
path = "fuzz_targets/event_json.rs"
test = false
doc = false
